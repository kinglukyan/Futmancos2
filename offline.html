<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c0a">
  <title>Futmancos sem conexão</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0a0c0a; color: #f3f4f6; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    main { max-width: 420px; padding: 28px; border: 1px solid #24452a; border-radius: 20px; background: #121612; }
    h1 { color: #4caf50; font-size: 1.5rem; }
    button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #388e3c; color: #fff; font-weight: 700; }
  </style>
</head>
<body><main><h1>Você está sem conexão</h1><p>Conecte-se à internet para acessar os dados compartilhados da Futmancos e tente novamente.</p><button onclick="location.reload()">Tentar novamente</button></main></body>
</html>
